name: Justlife
description: Justlife is the Middle East's leading home-services super app, connecting
  customers with vetted professionals for on-demand cleaning, beauty and wellness,
  healthcare-at-home, laundry, and home maintenance. Founded in 2015 by Cagatay Ozcan
  and Kerem Kuyucu, the company operates across the UAE, Saudi Arabia, Kuwait, Qatar,
  Oman, and Bahrain through its consumer mobile apps and website. Justlife publishes
  no public developer API; this profile captures its public web, policy, security,
  and AI-agent (llms.txt) surface for the API Evangelist network.
